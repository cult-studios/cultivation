name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 12:00 UTC every Monday and Thursday - well under the 7-day pause window
    - cron: '0 12 * * 1,4'
  workflow_dispatch: {} # allows to trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/signups?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
